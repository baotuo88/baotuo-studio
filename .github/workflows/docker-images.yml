name: Build and publish Docker images

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-images-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Regression checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Deployment checks
        run: node --test scripts/test-direct-deployment.mjs scripts/test-image-deployment.mjs
      - name: Channel and proxy checks
        working-directory: web
        run: node --experimental-strip-types --loader ./scripts/node-test-loader.mjs --test src/features/settings/lib/channel-draft.test.ts src/app/webdav-proxy/route.test.ts
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Backend regression checks
        working-directory: server
        run: mvn -B -Dtest=PersistenceServiceTest,AgentTaskOrchestratorTest test

  images:
    needs: checks
    name: ${{ matrix.service }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: web
            context: .
            dockerfile: web/Dockerfile
          - service: server
            context: ./server
            dockerfile: server/Dockerfile
          - service: publisher
            context: ./publisher-service
            dockerfile: publisher-service/Dockerfile
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Verify deployment excludes bundled gateways
        if: matrix.service == 'web'
        run: node --test scripts/test-direct-deployment.mjs scripts/test-image-deployment.mjs

      - name: Set image namespace
        id: namespace
        shell: bash
        env:
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: echo "owner=${REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ steps.namespace.outputs.owner }}/baotuo-studio-${{ matrix.service }}
          flavor: latest=false
          tags: |
            type=sha,format=long,prefix=sha-
            type=ref,event=branch
            type=ref,event=tag
            type=ref,event=pr
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}

      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_SERVER_URL=
            NEXT_PUBLIC_APP_VERSION=${{ github.sha }}
            NEXT_PUBLIC_CREDIT_STORE_URL=${{ vars.NEXT_PUBLIC_CREDIT_STORE_URL }}
            NEXT_PUBLIC_ICP_RECORD_NUMBER=${{ vars.NEXT_PUBLIC_ICP_RECORD_NUMBER }}
            NEXT_PUBLIC_GITHUB_URL=${{ vars.NEXT_PUBLIC_GITHUB_URL }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
